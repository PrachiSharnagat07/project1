<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    button{
        background-color: rgb(15, 175, 175);
        border: 2px;
        border-radius: 10px;
    }
    button:hover{
        background-color: rgba(163, 186, 186, 0.499);
    }
</style>

<body>
    <h1>rock | pepar | scissor</h1>
    <div>
        <h2>
            <span>user:</span>
            <span id="user"></span>
        </h2>
        <h2>
            <span>computer:</span>
            <span id="computer"></span>
        </h2>
        <h2>
            <span>result:</span>
            <span id="result"></span>
        </h2>
        <h2>
            <span>score:</span>
            <span id="score"></span>
        </h2>
    </div>
    <button onclick="choose('rock')">rock</button>
    <button onclick="choose('pepar')">pepar</button>
    <button onclick="choose('scissor')">scissor</button>

</body>
<script>
    let userBox = document.getElementById("user")
    let computerBox = document.getElementById("computer")
    let resultBox = document.getElementById("result")
    let scoreBox = document.getElementById("score")
    let game = ["rock", "pepar", "scissor",]
    let computerchoice;
    score = 0;


    function choose(user) {
        console.log(user);
        userBox.innerText = user
        let index = Math.floor(Math.random() * 3)
        console.log("index", index)
        computerchoice = game[index];
        console.log(computerchoice)
        computerBox.innerText = computerchoice

        // condition
        if (user == "rock" && computerchoice == "scissor") {
            console.log("user win");
            resultBox.innerText = "user win 🌹"
            scoreBox.innerText = score
        }
        else if (user == "scissor" && computerchoice == "pepar") {
            console.log("user win");
            score++;
            resultBox.innerText = "user win 🌹"
            scoreBox.innerText = score
        }
        else if (user == "pepar" && computerchoice == "rock") {
            console.log("user win");
            score++
            resultBox.innerText = "user win 🌹"
            scoreBox.innerText = score

        }
        else if (user == computerchoice) {
            console.log("drow");
            resultBox.innerText = "drow"
            scoreBox.innerText = score

        }
        else {
            console.log("computer win");
            score--;
            scoreBox.innerText = score
            resultBox.innerText = "computer win"

        }






    }
</script>

</html>
